<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfólio de Henrique Vieira, desenvolvedor full-stack.">
    {% load static %}
    <title>{% block title %}Henrique Vieira — Portfólio{% endblock %}</title>
    <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
    <link rel="icon" href="{% static 'favicon.png' %}" type="image/png">
    <link rel="apple-touch-icon" href="{% static 'favicon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollToPlugin.min.js" defer></script>
    <script src="{% static 'js/site.js' %}" defer></script>
    <script src="{% static 'js/capa-dropzone.js' %}" defer></script>
    <script src="{% static 'js/galeria-upload.js' %}" defer></script>
    {% block extra_scripts %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="page-transition" data-page-transition aria-hidden="true"></div>
    {% include "partials/nav.html" %}

    {% if messages %}
    <div class="messages" aria-live="polite">
        {% for message in messages %}
        <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
